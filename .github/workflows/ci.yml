name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci
      - name: types
        run: npm run check
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
      - name: no em dash
        run: tools/no_em_dash.sh
      - name: the repository agrees about which version it is
        run: node tools/check_release.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: the browser playwright drives
        run: npx playwright install --with-deps chromium
      - name: the rack in a desktop and a phone browser
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
